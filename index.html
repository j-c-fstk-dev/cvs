<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal lunar — Jorge Cristo</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--mint:#a7f9c9;--dim:#91b6a1;--edge:#355449}
body{margin:0;background:#06090b;color:#e5eeeb;font:14px ui-monospace,"SFMono-Regular",Consolas,monospace}
.stage{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;position:relative;overflow:hidden}
.scene-pending .stage{visibility:hidden}
.scene{position:relative;width:min(100vw,150svh);aspect-ratio:3/2;container-type:inline-size;flex:none}
.art{display:block;width:100%;height:100%;object-fit:fill}
.earth{position:absolute;left:25.55%;top:8.24%;width:46.95%;height:auto;pointer-events:none;opacity:0;
clip-path:polygon(0 0,100% 0,100% 100%,88.5% 100%,88.3% 57%,87.9% 55.8%,86.9% 54.85%,84.7% 54.45%,70% 54%,50% 53.95%,30% 54.1%,13.7% 54.55%,11.6% 54.9%,10.65% 56%,10.35% 57.1%,10.1% 100%,0 100%)}
.earth[data-active]{opacity:1}
@media(prefers-reduced-motion:reduce){.earth{display:none}}
.brand{position:absolute;z-index:2;top:clamp(22px,5vh,48px);left:clamp(22px,4vw,64px);display:flex;align-items:center;gap:13px}
.mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid #48665f;border-radius:9px;color:var(--mint);font-weight:bold;background:#101a1bdd}
.brand strong{display:block;font:600 16px system-ui,sans-serif;letter-spacing:.025em}
.brand small{display:block;color:#a4b7ba;margin-top:4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.caption{position:absolute;left:clamp(22px,4vw,64px);bottom:24px;color:#d2dedb;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:#090e12e8;border:1px solid #3b4c4a;border-radius:5px;padding:9px 12px}
.crt{position:absolute;left:33.56%;top:50.6%;width:29.87%;height:30.1%;border-radius:7% / 8%;overflow:hidden;display:flex;flex-direction:column;padding:clamp(12px,1.25cqw,22px);color:var(--mint);background:radial-gradient(ellipse at 42% 20%,#162c24,#091712 76%,#060f0d);box-shadow:inset 0 0 22px #030b08,0 0 9px #7ef2aa33;border:1px solid #2b4538;font-size:clamp(10px,.92cqw,15px)}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(transparent 0 3px,#0002 3px 4px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--edge);padding-bottom:.6em;font-size:.75em;letter-spacing:.12em;white-space:nowrap}
.online{color:var(--dim);display:flex;align-items:center;gap:.55em}
.online[data-ready]::before{content:"";width:.55em;height:.55em;background:#95ffb9;border-radius:50%;box-shadow:0 0 8px #81f9a9aa}
.chat{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#426354 transparent;margin:0 -.3em;padding:0 .3em}
h1,h2{font-weight:700;margin:.48em 0 .22em;font-size:1.23em;line-height:1.15;letter-spacing:-.04em}
p{margin:0 0 .56em;color:#c2dcca;font-size:.92em;line-height:1.35}
[hidden]{display:none!important}
.options{display:grid;gap:.27em}
button,a,input{font:inherit}
button,.action{border:1px solid var(--edge);background:#182d23;color:var(--mint);border-radius:4px;text-decoration:none;cursor:pointer}
.option{display:grid;grid-template-columns:2em 1fr auto;align-items:center;text-align:left;padding:.25em .55em;min-height:2em;gap:.3em;font-size:.94em}
.option kbd{font:inherit;color:#a1ecc2;font-size:.88em;letter-spacing:.04em}
.option:hover,.action:hover,form button:hover{background:#254c38;border-color:#7fdca6}
:focus-visible{outline:2px solid #d8ffe6;outline-offset:-2px}
form{display:flex;align-items:center;gap:.55em;margin-top:.25em;padding-top:.36em;border-top:1px solid var(--edge);font-size:.83em}
form label{font-weight:bold}
.command-hint{margin:.26em 0 0;color:var(--dim);font-size:.69em;line-height:1.2}
.command-help{white-space:pre-line}
input{min-width:0;flex:1;background:transparent;border:0;color:var(--mint);padding:.35em .25em}
input::placeholder{color:var(--dim)}
form button{padding:.25em .55em}
.reply{margin-top:.5em;color:#e2ffeb}
.actions{display:flex;gap:.35em;flex-wrap:wrap;margin:.55em 0}
.action{padding:.42em .55em;font-size:.86em}
.lang{display:flex;align-items:center;gap:.45em;margin:.5em 0;color:var(--dim);font-size:.85em}
.lang button{padding:.26em .6em}
.lang button[aria-pressed=true]{background:#a7f9c9;color:#0c1a13}
dialog{width:min(960px,94vw);height:min(800px,91svh);padding:0;border:1px solid #4d7763;border-radius:12px;background:#10211a;color:var(--mint)}
dialog::backdrop{background:#030806dd}
.dialog-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;height:48px}
iframe{border:0;width:100%;height:calc(100% - 48px);background:white;display:block}
@media(max-aspect-ratio: 1/1){
.stage{min-height:max(100svh,132vw)}
.scene{width:260vw;max-width:none;margin-left:7vw;transform:translateY(-16vw)}
.crt{font-size:clamp(10px,2.95vw,16px);padding:clamp(10px,3.5vw,20px)}
.brand{top:20px}.caption{left:auto;right:20px;bottom:18px}
}
@media(min-aspect-ratio:1/1) and (max-height:650px){
.scene{width:min(100vw,175svh)}
.brand{top:12px;left:12px}
.caption{bottom:10px;left:10px}
.crt{padding:8px}
}
.intro{margin:.65em 0 .42em}
.intro p{margin:0 0 .27em}
.chat[data-connecting]{display:grid;place-items:center;text-align:center}
.chat[data-connecting] .loader{width:100%}
.chat[data-connecting] .loader-track{margin-inline:auto}
.loader{margin:.65em 0}
.loader p{margin-bottom:.36em}
.loader-track{width:min(100%,17em);height:1em;border:1px solid #668c77;padding:2px;box-shadow:inset 1px 1px #05100a;background:#07150f}
.loader-fill{height:100%;background:repeating-linear-gradient(90deg,#91eeb5 0 .7em,transparent .7em .9em);animation:progress var(--duration) steps(15,end) both}
@keyframes progress{from{width:0}to{width:100%}}
.contact{margin:.6em 0}
.contact .action{display:inline-block}
.share-dialog{height:auto;padding:14px}
.share-dialog .dialog-bar{height:auto;padding:0;margin-bottom:.7em}
.share-dialog input{display:block;width:100%;border:1px solid var(--edge);padding:.5em}
@media(prefers-reduced-motion:reduce){.loader-fill{animation:none}}
</style>
<script>document.documentElement.classList.add('scene-pending');</script>
</head>
<body>
<main class="stage">
  <header class="brand"><span class="mark" aria-hidden="true">JC</span><div><strong>Jorge Cristo</strong><small data-copy="terminal">Terminal lunar</small></div></header>
  <div class="scene">
    <img class="art" src="./assets/terminal-lunar.webp" data-alt alt="Monitor bege, teclado, mouse e caixas de som retrô sobre uma mesa na Lua, com a Terra ao fundo">
    <canvas class="earth" id="earth" width="384" height="384" aria-hidden="true"></canvas>
    <section class="crt" data-label="terminalLabel" aria-label="Terminal de currículos">
      <div class="bar"><span data-copy="portfolio">PORTFÓLIO / CV</span><span class="online" id="status"></span></div>
      <div class="chat" id="chat"></div>
      <p id="command-hint" class="command-hint" data-copy="hint" hidden></p>
      <form id="prompt" hidden>
        <label for="command" data-label="inputLabel" aria-label="Digite uma opção">❯</label>
        <input type="text" id="command" placeholder="Digite 1, 2 ou 3" inputmode="text" enterkeyhint="send" maxlength="12" aria-describedby="command-hint" autocapitalize="off" spellcheck="false" autocomplete="off">
        <button type="submit" data-copy="send">Enviar ↵</button>
      </form>
    </section>
  </div>
  <span class="caption" data-copy="caption">Lua · Estação CRT</span>
</main>

<dialog id="preview" aria-labelledby="preview-title">
  <div class="dialog-bar"><strong id="preview-title"></strong><button type="button" class="action" id="close" data-copy="close">Fechar ×</button></div>
  <iframe id="document-view" data-title="previewTitle" title="Visualização do currículo" sandbox></iframe>
</dialog>

<dialog class="share-dialog" id="share-dialog" aria-labelledby="share-title">
  <div class="dialog-bar"><strong id="share-title" data-copy="share">Compartilhar link</strong><button type="button" class="action" id="close-share" data-copy="close">Fechar ×</button></div>
  <p data-copy="manualShare">Copie o link selecionado para compartilhar.</p>
  <input id="share-url" data-label="share" aria-label="Compartilhar link" type="url" readonly>
</dialog>

<template id="menu">
  <div class="intro">
    <h1></h1>
    <p></p>
    <p></p>
  </div>
  <div class="options" hidden>
    <button class="option" type="button" data-choice="1"><kbd>01</kbd><span></span><span aria-hidden="true">›</span></button>
    <button class="option" type="button" data-choice="2"><kbd>02</kbd><span></span><span aria-hidden="true">›</span></button>
    <button class="option" type="button" data-choice="3"><kbd>03</kbd><span></span><span aria-hidden="true">›</span></button>
  </div>
  <div class="contact" hidden><p></p><a class="action" data-copy="email" hidden>Enviar e-mail</a></div>
  <p class="reply" role="status" hidden></p>
</template>
<template id="result">
  <h2></h2>
  <div class="lang" role="group" data-label="languageLabel" aria-label="Idioma do currículo">
    <span data-copy="language">Idioma</span><button type="button" data-lang="PT">PT</button><button type="button" data-lang="EN">EN</button>
  </div>
  <div class="actions">
    <button type="button" class="action" id="open" data-copy="actionOpen">Visualizar ↗</button>
    <a class="action" id="download" data-copy="actionDownload">Baixar ↓</a>
    <button type="button" class="action" id="share" data-copy="actionShare">Compartilhar link</button>
    <button type="button" class="action" id="switch-cv" data-copy="switchMobile" hidden></button>
    <button type="button" class="action" id="back" data-copy="back">Voltar</button>
  </div>
  <p class="reply" role="status" hidden></p>
</template>
<script>
const pt = {
  terminal: 'Terminal lunar', terminalLabel: 'Terminal de currículos', portfolio: 'PORTFÓLIO / CV',
  caption: 'Lua · Estação CRT', send: 'Enviar ↵', inputLabel: 'Digite uma opção',
  close: 'Fechar ×', previewTitle: 'Visualização do currículo',
  language: 'Idioma', languageLabel: 'Idioma do currículo',
  share: 'Compartilhar link', back: 'Voltar', email: 'Enviar e-mail',
  connect: 'Conectando ao servidor lunar…', connected: 'Conexão estabelecida.', loading: 'Carregando currículos…',
  intro: ['Olá, Jorge aqui.', 'Procurando meu currículo?', 'Tenho três opções. Escolha a que mais te interessa.'],
  choices: ['Desenvolvimento freelance', 'Desenvolvimento para empresas', 'Tradução'],
  thanks: 'Obrigado pela visita!', contact: 'Quer entrar em contato? É só clicar abaixo para me enviar um e-mail.',
  hint: 'Digite help para ver os comandos',
  actionOpen: '1 Visualizar', actionDownload: '2 Baixar', actionShare: '3 Compartilhar',
  menuPrompt: 'Digite 1, 2, 3 ou help', actionPrompt: 'Digite um comando',
  menuHelp: '1, 2, 3 — escolher currículo',
  actionHelp: '1 — visualizar\n2 — baixar\n3 — compartilhar\nEsc — voltar · Tab — trocar de currículo',
  switchMobile: '4 Trocar currículo', backMobile: '5 Voltar',
  actionHelpMobile: '1 — visualizar\n2 — baixar\n3 — compartilhar\n4 — trocar de currículo\n5 — voltar',
  opening: 'Abrindo currículo…', returning: 'Carregando menu…',
  invalid: 'Comando inválido. Digite help.', copied: 'Link copiado.',
  manualShare: 'Copie o link selecionado para compartilhar.',
  alt: 'Monitor bege, teclado, mouse e caixas de som retrô sobre uma mesa na Lua, com a Terra ao fundo'
};
const en = {
  terminal: 'Lunar terminal', terminalLabel: 'Résumé terminal', portfolio: 'PORTFOLIO / CV',
  caption: 'Moon · CRT station', send: 'Send ↵', inputLabel: 'Enter an option',
  close: 'Close ×', previewTitle: 'Résumé preview',
  language: 'Language', languageLabel: 'Résumé language',
  share: 'Share link', back: 'Back', email: 'Send email',
  connect: 'Connecting to the lunar server…', connected: 'Connection established.', loading: 'Loading résumés…',
  intro: ['Hi, Jorge here.', 'Looking for my résumé?', 'I have three options. Pick the one that suits you best.'],
  choices: ['Freelance development', 'Development for companies', 'Translation'],
  thanks: 'Thanks for stopping by!', contact: 'Want to get in touch? Click below to send me an email.',
  hint: 'Type help to see commands',
  actionOpen: '1 View', actionDownload: '2 Download', actionShare: '3 Share',
  menuPrompt: 'Type 1, 2, 3, or help', actionPrompt: 'Type a command',
  menuHelp: '1, 2, 3 — choose a résumé',
  actionHelp: '1 — view\n2 — download\n3 — share\nEsc — back · Tab — switch résumé',
  switchMobile: '4 Switch résumé', backMobile: '5 Back',
  actionHelpMobile: '1 — view\n2 — download\n3 — share\n4 — switch résumé\n5 — back',
  opening: 'Opening résumé…', returning: 'Loading menu…',
  invalid: 'Unknown command. Type help.', copied: 'Link copied.',
  manualShare: 'Copy the selected link to share it.',
  alt: 'Beige monitor, keyboard, mouse and retro speakers on a desk on the Moon, with Earth in the background'
};
const languages = navigator.languages?.length ? navigator.languages : [navigator.language || ''];
const preferred = languages.map(language => language.toLowerCase().split('-')[0])
  .find(language => language === 'pt' || language === 'en');
const isPortuguese = preferred === 'pt';
const copy = isPortuguese ? pt : en;
const categories = ['Dev_Freelance', 'Dev_Empresas', 'Tradutor'];
const emails = ['dev.jorge.c@gmail.com', 'dev.jorge.c@gmail.com', 'cristtranslations@gmail.com'];
const chat = document.querySelector('#chat');
const form = document.querySelector('#prompt');
const command = document.querySelector('#command');
const hint = document.querySelector('#command-hint');
const status = document.querySelector('#status');
const dialog = document.querySelector('#preview');
const frame = document.querySelector('#document-view');
const shareDialog = document.querySelector('#share-dialog');
const shareUrl = document.querySelector('#share-url');
const touch = matchMedia('(pointer: coarse)');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let selection;
let documentPath;
let opening;
let sharing = false;
let transitioning = false;
let shareSession = new AbortController();

document.documentElement.lang = isPortuguese ? 'pt-BR' : 'en';
document.title = copy.terminal + ' — Jorge Cristo';
document.querySelector('[data-alt]').alt = copy.alt;
command.placeholder = copy.menuPrompt;

function translate(container) {
  container.querySelectorAll('[data-copy]').forEach(el => el.textContent = copy[el.dataset.copy]);
  container.querySelectorAll('[data-label]').forEach(el => el.setAttribute('aria-label', copy[el.dataset.label]));
  container.querySelectorAll('[data-title]').forEach(el => el.title = copy[el.dataset.title]);
}
translate(document);

function wait(ms) {
  return motion.matches ? Promise.resolve() : new Promise(resolve => setTimeout(resolve, ms));
}

async function typeLine(line, value) {
  line.textContent = '';
  line.hidden = false;
  if (!motion.matches) {
    line.setAttribute('aria-busy', 'true');
    for (const char of value) {
      if (!line.isConnected) return;
      line.textContent += char;
      await wait(28);
    }
    line.removeAttribute('aria-busy');
  } else {
    line.textContent = value;
  }
}

function show(template) {
  chat.replaceChildren(document.querySelector('#' + template).content.cloneNode(true));
  translate(chat);
  chat.scrollTop = 0;
}

async function loader(message, duration, before = null) {
  const block = document.createElement('div');
  block.className = 'loader';
  const label = document.createElement('p');
  label.textContent = message;
  const track = document.createElement('div');
  track.className = 'loader-track';
  track.setAttribute('aria-hidden', 'true');
  const fill = document.createElement('div');
  fill.className = 'loader-fill';
  fill.style.setProperty('--duration', duration + 'ms');
  track.append(fill);
  block.append(label, track);
  chat.insertBefore(block, before);
  await wait(duration);
  block.remove();
}

function populateMenu() {
  chat.querySelectorAll('[data-choice]').forEach((button, index) => {
    button.querySelector('span').textContent = copy.choices[index];
  });
  return chat.querySelectorAll('.intro h1, .intro p');
}

function focusPrompt() {
  if (!touch.matches) command.focus({preventScroll: true});
}

async function boot() {
  status.textContent = isPortuguese ? 'CONECTANDO' : 'CONNECTING';
  chat.dataset.connecting = '';
  await loader(copy.connect, 3000);
  delete chat.dataset.connecting;
  status.textContent = 'ONLINE';
  status.setAttribute('data-ready', '');
  status.title = copy.connected;
  show('menu');
  const lines = populateMenu();
  for (const [index, line] of Array.from(lines).entries()) {
    await typeLine(line, copy.intro[index]);
    await wait(230);
  }
  const options = chat.querySelector('.options');
  await loader(copy.loading, 2000, options);
  options.hidden = false;
  form.hidden = false;
  hint.hidden = false;
  focusPrompt();
}

function setLanguage(language) {
  const name = 'Jorge_Cristo_' + categories[selection] + '_' + language + '.html';
  documentPath = './curriculos/' + name;
  const download = document.querySelector('#download');
  download.href = documentPath;
  download.download = name;
  chat.querySelectorAll('[data-lang]').forEach(button => {
    button.setAttribute('aria-pressed', button.dataset.lang === language);
  });
}

function replyOnce(message, line = chat.querySelector('.reply')) {
  if (line && line.isConnected && line.hidden) void typeLine(line, message);
}

async function transition(message, duration = 1000) {
  transitioning = true;
  command.value = '';
  if (touch.matches) command.blur();
  command.readOnly = true;
  chat.replaceChildren();
  await loader(message, duration);
  command.readOnly = false;
  transitioning = false;
}

async function choose(number) {
  await transition(copy.opening);
  selection = Number(number) - 1;
  command.placeholder = copy.actionPrompt;
  show('result');
  chat.querySelector('h2').textContent = copy.choices[selection];
  if (touch.matches) {
    chat.querySelector('#switch-cv').hidden = false;
    chat.querySelector('#back').textContent = copy.backMobile;
  }
  setLanguage(isPortuguese ? 'PT' : 'EN');
  focusPrompt();
}

function runCommand(value) {
  if (transitioning || form.hidden) return;
  command.value = '';
  if (/^[123]$/.test(value)) {
    if (selection === undefined) {
      void choose(value);
    } else {
      chat.querySelector(['#open', '#download', '#share'][Number(value) - 1]).click();
    }
    return;
  }
  if (touch.matches && selection !== undefined && /^[45]$/.test(value)) {
    void backToMenu(value === '5');
    return;
  }
  const helpText = selection === undefined ? copy.menuHelp
    : touch.matches ? copy.actionHelpMobile : copy.actionHelp;
  const message = value === 'help' ? helpText : copy.invalid;
  let help = chat.querySelector('.command-help');
  if (!help) {
    help = document.createElement('p');
    help.className = 'reply command-help';
    help.setAttribute('role', 'status');
    chat.append(help);
  }
  help.textContent = message;
  chat.scrollTop = chat.scrollHeight;
}

function thank(message = copy.thanks, line = chat.querySelector('.reply')) {
  replyOnce(message, line);
}

async function backToMenu(offerContact = true) {
  const previous = selection;
  await transition(copy.returning, 350);
  selection = undefined;
  command.placeholder = copy.menuPrompt;
  show('menu');
  populateMenu().forEach((line, index) => line.textContent = copy.intro[index]);
  chat.querySelector('.options').hidden = false;
  focusPrompt();
  if (!offerContact) return;
  const contact = chat.querySelector('.contact');
  const link = contact.querySelector('a');
  link.href = 'mailto:' + emails[previous];
  contact.hidden = false;
  await typeLine(contact.querySelector('p'), copy.contact);
  if (!contact.isConnected) return;
  link.hidden = false;
  chat.scrollTop = chat.scrollHeight;
}

async function share() {
  if (sharing) return;
  sharing = true;
  const line = chat.querySelector('.reply');
  const url = new URL(documentPath, document.baseURI).href;
  try {
    if (navigator.share) {
      try {
        await navigator.share({title: copy.choices[selection] + ' — Jorge Cristo', url});
        thank(copy.thanks, line);
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }
    try {
      await navigator.clipboard.writeText(url);
      thank(copy.copied + ' ' + copy.thanks, line);
    } catch {
      if (!line.isConnected) return;
      shareUrl.value = url;
      shareDialog.showModal();
      shareUrl.select();
      shareUrl.addEventListener('copy', () => thank(copy.thanks, line), {
        once: true, signal: shareSession.signal
      });
    }
  } finally {
    sharing = false;
  }
}

chat.addEventListener('click', event => {
  const control = event.target.closest('button, a');
  if (!control || transitioning) return;
  if (control.dataset.choice) {
    runCommand(control.dataset.choice);
  }
  if (control.dataset.lang) setLanguage(control.dataset.lang);
  if (control.id === 'switch-cv') void backToMenu(false);
  if (control.id === 'back') void backToMenu();
  if (['open', 'download', 'share'].includes(control.id)) {
    if (touch.matches) command.blur();
    chat.querySelector('.command-help')?.remove();
  }
  if (control.id === 'share') void share();
  if (control.id === 'download') thank();
  if (control.id === 'open') {
    document.querySelector('#preview-title').textContent = copy.choices[selection];
    frame.src = documentPath;
    opening = chat.querySelector('.reply');
    dialog.showModal();
  }
});

form.addEventListener('submit', event => {
  event.preventDefault();
  runCommand(command.value.trim().toLowerCase());
});
document.addEventListener('keydown', event => {
  if (touch.matches || transitioning || selection === undefined || dialog.open || shareDialog.open ||
      event.ctrlKey || event.altKey || event.metaKey || event.isComposing) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    void backToMenu();
  } else if (event.key === 'Tab' && !event.shiftKey && event.target === command) {
    event.preventDefault();
    void backToMenu(false);
  }
});

command.addEventListener('keydown', event => {
  if (event.repeat || event.isComposing || event.ctrlKey || event.altKey || event.metaKey ||
      command.value || !/^[1-5]$/.test(event.key)) return;
  if (/^[45]$/.test(event.key) && (!touch.matches || selection === undefined)) return;
  event.preventDefault();
  runCommand(event.key);
});
document.querySelector('#close').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => {
  frame.removeAttribute('src');
  thank(copy.thanks, opening);
  opening = undefined;
});
document.querySelector('#close-share').addEventListener('click', () => shareDialog.close());
shareDialog.addEventListener('close', () => {
  shareSession.abort();
  shareSession = new AbortController();
});
async function revealScene() {
  const root = document.documentElement;
  const art = document.querySelector('.art');
  const earth = document.querySelector('#earth');
  const startup = new AbortController();
  let timeout;
  const globeReady = motion.matches ? Promise.resolve() : new Promise(resolve => {
    earth.addEventListener('earth-ready', resolve, {once: true, signal: startup.signal});
    motion.addEventListener('change', event => {
      if (event.matches) resolve();
    }, {signal: startup.signal});
  });
  await Promise.race([
    Promise.all([art.decode().catch(() => {}), globeReady]),
    new Promise(resolve => {
      timeout = setTimeout(() => {
        if (!motion.matches && !earth.hasAttribute('data-active')) earth.dataset.static = '';
        resolve();
      }, 2500);
    })
  ]);
  clearTimeout(timeout);
  startup.abort();
  root.classList.remove('scene-pending');
  void boot();
}

void revealScene();
</script>
